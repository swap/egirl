    description: The prettiest platform for anyone to put their links, info, or anything about themselves on the prettiest pages.
    support: https://dol.ls/donate
    url: https://dol.ls
    github: dollsbio
    date: 2026
    version: 0.3.0

  - name: swarm
    description: A free comic reading platform for manga, manhwa, and manhua, aggregating 600K+ unique comics and 19M+ chapters across 60+ languages from 400+ websites and sources, with support for both SFW and NSFW content and fast updates.
    url: https://swarm.ws
    github: swarmws
    date: 2025
    version: 1.4.8

  - name: saint
    description: A Discord bot serving over 500 Discord servers and 700,000 users with over 600 unique commands spanning moderation, utility, security, fun, games, miscellaneous features, and much more, including unique commands you won't find in other bots.
    github: saintcord
    url: https://saint.bot
    date: 2025
    version: 1.1.0

